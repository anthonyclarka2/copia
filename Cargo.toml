[package]
name = "copia"
version = "0.1.0"
description = "Your AI coding quotas, as little bars in the menubar / system tray"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
strip = true
