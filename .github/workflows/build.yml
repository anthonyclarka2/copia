name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential
      - run: cargo build --release --locked

  windows-installer:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: copia-windows-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
